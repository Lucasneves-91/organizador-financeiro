{% extends "transacoes/base.html" %}

{% block titulo %}{{ titulo }} · Organizador Financeiro{% endblock %}

{% block conteudo %}
<div class="topo">
    <h1>{{ titulo }}</h1>
</div>

<div class="cartao-formulario">
    {% if form.non_field_errors %}
    <div class="erros">{{ form.non_field_errors }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit" class="botao">Salvar</button>
    </form>
</div>

<a href="{% url 'transacoes:lista' %}" class="voltar">&larr; Voltar para a lista</a>
{% endblock %}
